<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="10;url=https://c.schoep.ke">
  <title>Umzug — C-Übungsaufgaben</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 3rem;
      max-width: 520px;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #3b82f6, #7c3aed);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.85; }
    .countdown {
      margin-top: 1.25rem;
      color: #64748b;
      font-size: 0.85rem;
    }
    .countdown span {
      color: #60a5fa;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>Inhalte sind umgezogen!</h1>
    <p>
      Die C-Übungsaufgaben sind ab sofort unter einer neuen Adresse verfügbar.
      Bitte aktualisiere deine Lesezeichen.
    </p>
    <a href="https://c.schoep.ke" class="btn">Zur neuen Seite →</a>
    <div class="countdown">
      Automatische Weiterleitung in <span id="timer">10</span> Sekunden
    </div>
  </div>
  <script>
    let seconds = 10;
    const el = document.getElementById('timer');
    const interval = setInterval(() => {
      seconds--;
      el.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = 'https://c.schoep.ke';
      }
    }, 1000);
  </script>
</body>
</html>
